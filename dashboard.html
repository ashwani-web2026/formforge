<!DOCTYPE html>
<html>
<head>
<title>FFMIC Admin - Registrations</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-firestore-compat.js"></script>
<style>
body{font-family:sans-serif;background:#f5f5ff;padding:20px}
h2{margin:0} table{width:100%;border-collapse:collapse;background:white;border-radius:10px;overflow:hidden;margin-top:15px}
th,td{padding:12px;text-align:left;border-bottom:1px solid #eee;font-size:14px}
th{background:#111;color:white}
.btn{padding:10px 15px;background:#00c950;color:white;border:0;border-radius:6px;font-weight:bold;cursor:pointer}
</style>
</head>
<body>
<h2>TEZ FFMIC 2026 - Registrations</h2>
<p id="total">Total Responses: 0</p>
<button class="btn" onclick="downloadCSV()">Download Excel (CSV)</button>
<table>
<thead><tr><th>#</th><th>Date</th><th>Team Name</th><th>Captain</th><th>Captain ID</th><th>WhatsApp</th><th>Roster IDs</th></tr></thead>
<tbody id="tableBody"></tbody>
</table>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyBiJLamHfmLzNGDoVP1-96hHYEmf4diHtk",
  authDomain: "formforge-22735.firebaseapp.com",
  projectId: "formforge-22735",
  storageBucket: "formforge-22735.firebasestorage.app",
  messagingSenderId: "688939760627",
  appId: "1:688939760627:web:ad2b0838a4b77a4515f086"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
let allData=[];
db.collection("ffmic_2026_registrations").orderBy("createdAt","desc").onSnapshot((snapshot)=>{
  allData=[];
  let html="";
  let i=1;
  snapshot.forEach((doc)=>{
    const d=doc.data();
    const date=d.createdAt? new Date(d.createdAt.seconds*1000).toLocaleString() : "Just now";
    allData.push({...d, date});
    html+=`<tr><td>${i++}</td><td>${date}</td><td>${d.teamName||''}</td><td>${d.captainName||''}</td><td>${d.captainID||''}</td><td>${d.whatsapp||''}</td><td>${d.rosterIDs||''}</td></tr>`;
  });
  document.getElementById('tableBody').innerHTML=html;
  document.getElementById('total').innerText="Total Responses: "+snapshot.size;
});
function downloadCSV(){
  let csv="Team Name,Captain Name,Captain ID,Whatsapp,Roster IDs,Date\n";
  allData.forEach(r=>{csv+=`"${r.teamName}","${r.captainName}","${r.captainID}","${r.whatsapp}","${r.rosterIDs}","${r.date}"\n`});
  const blob=new Blob([csv],{type:'text/csv'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download="ffmic_registrations.csv";a.click();
}
</script>
</body>
</html>
